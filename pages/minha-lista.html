
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Gerencie seus filmes e séries favoritos no CineFinder."
    >

    <title>Minha Lista | CineFinder</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/minha-lista.css">

    <script src="../js/minha-lista.js" defer></script>
</head>

<body>

    <header class="cabecalho">
        <div class="container navegacao">

            <a href="../index.html" class="logo">
                Cine<span>Finder</span>
            </a>

            <nav class="menu">
                <a href="../index.html">Início</a>
                <a href="../index.html#destaques">Destaques</a>
                <a href="../index.html#sobre">Sobre</a>
                <a href="minha-lista.html" class="link-ativo">Minha Lista</a>
            </nav>

        </div>
    </header>

    <main class="conteudo-lista">

        <section class="secao-lista">

            <div class="cabecalho-lista">
                <div>
                    <span class="subtitulo">SEU CATÁLOGO PESSOAL</span>
                    <h1>Minha Lista</h1>

                    <p class="descricao-lista">
                        Organize seus filmes e séries favoritos
                        em um só lugar.
                    </p>
                </div>

                <a href="../index.html" class="botao-voltar">
                    + Explorar títulos
                </a>
            </div>

            <div class="resumo-lista">
                <span id="contador-lista">0 títulos salvos</span>
                <span>Seus títulos, suas escolhas.</span>
            </div>

            <p
                id="mensagem-lista"
                class="mensagem mensagem-lista"
                aria-live="polite"
            ></p>

            <div
                id="lista-filmes"
                class="filmes-grid"
                aria-live="polite"
            ></div>

        </section>

    </main>

    <footer class="rodape">
        <div class="container rodape-conteudo">

            <a href="../index.html" class="logo">
                Cine<span>Finder</span>
            </a>

            <p>Projeto acadêmico de Programação Web II.</p>

            <p class="copyright">
                &copy; 2026 CineFinder. Projeto educacional.
            </p>

        </div>
    </footer>

</body>

</html>
